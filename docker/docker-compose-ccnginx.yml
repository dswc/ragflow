include:
  - ./docker-compose-gpu.yml

services:
  nginx:
    image: nginx:1.27.4
    container_name: ccnginx
    restart: always
    ports:
      - 80:80
      - 8443:443
    volumes:
      - ./ccnginx/server.pem:/server.pem:ro
      - ./ccnginx/server.key:/server.key:ro
      - ./ccnginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ragflow
      - mysql
    networks:
      - ragflow
